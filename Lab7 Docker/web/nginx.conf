server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/cv_access.log;   # fisier propriu, salvat in volumul cv-logs

    # DNS-ul retelei Docker: numele "images" si "css" duc la celelalte containere
    resolver 127.0.0.11 valid=10s;

    # /img/<fisier>  -> containerul cv-images
    location ~ ^/img/(.+)$ {
        set $img_host http://images;
        proxy_pass $img_host/$1;
        proxy_set_header Host $host;
    }

    # /css/<fisier>  -> containerul cv-css
    location ~ ^/css/(.+)$ {
        set $css_host http://css;
        proxy_pass $css_host/$1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
