services:
  cv:
    build: ./cv
    container_name: lab7-cv
    ports:
      - "8080:80"
    depends_on:
      - images
      - css
    networks:
      - lab7-network

  images:
    build: ./images
    container_name: lab7-images
    ports:
      - "8081:80"
    networks:
      - lab7-network

  css:
    build: ./css
    container_name: lab7-css
    ports:
      - "8082:80"
    networks:
      - lab7-network
  timer:
    build: ./lab1
    container_name: lab7-timer
    ports:
      - "127.0.0.1:6080:6080"
    networks:
      - lab7-network
networks:
  lab7-network:
    driver: bridge