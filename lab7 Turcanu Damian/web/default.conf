server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Web-Container "web-container" always;

    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok","service":"web-container","option":"difficult"}';
    }

    location /assets/images/ {
        proxy_pass http://images:8080/;
        proxy_set_header Host $host;
    }

    location /assets/styles/ {
        proxy_pass http://styles:8080/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
